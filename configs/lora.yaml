lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["c_attn", "c_proj", "c_fc", "q_proj", "v_proj", "k_proj", "o_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  learning_rate: 3e-4
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  save_strategy: "epoch"
  output_dir: "results/checkpoints/lora"
